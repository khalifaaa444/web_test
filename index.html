<!DOCTYPE html>
<html>
<head>
    <title>ESP32 BLE Broadcast Receiver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #log {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .entry {
            margin: 5px 0;
            padding: 8px;
            border-bottom: 1px solid #333;
        }
        .time {
            color: #569cd6;
            font-size: 12px;
        }
        .rssi {
            color: #4ec9b0;
        }
        .hex {
            color: #ce9178;
        }
        .text {
            color: #dcdcaa;
        }
        .counter {
            color: #c586c0;
        }
        .temp {
            color: #9cdcfe;
        }
        .humidity {
            color: #4fc1ff;
        }
    </style>
</head>
<body>
    <h1>ESP32 BLE Broadcast Receiver</h1>
    <p>Receives data from ESP32 without any connection/pairing.</p>
    
    <button onclick="startScan()">Start Receiving Data</button>
    <button onclick="stopScan()" id="stopBtn" disabled>Stop</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <div id="status" style="margin: 15px 0; padding: 10px; background: #e3f2fd;">
        Ready. Click "Start Receiving Data"
    </div>
    
    <h3>Received Data:</h3>
    <div id="log">
        No data received yet...
    </div>
    
    <script>
        let device = null;
        let advertisementCount = 0;
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = message;
            
            logDiv.prepend(entry);
            
            // Keep only last 50 entries
            while (logDiv.children.length > 50) {
                logDiv.removeChild(logDiv.lastChild);
            }
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
            advertisementCount = 0;
        }
        
        function updateStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.style.background = isError ? '#ffebee' : '#e3f2fd';
            statusDiv.style.color = isError ? '#c62828' : '#1565c0';
        }
        
        async function startScan() {
            try {
                updateStatus('Requesting BLE device access...');
                log('<span class="time">Starting scan for ESP32...</span>');
                
                document.querySelector('button').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                
                // Try to get the ESP32 device
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-Beacon' }],
                    optionalServices: []
                });
                
                log(`<span class="time">Found device:</span> <span class="text">${device.name}</span>`);
                updateStatus(`Connected to ${device.name}. Receiving data...`);
                
                // Setup advertisement listener
                device.addEventListener('advertisementreceived', handleAdvertisement);
                
                // Start watching advertisements
                await device.watchAdvertisements();
                log('<span class="time">Now receiving broadcast data from ESP32...</span>');
                
            } catch (error) {
                log(`<span class="time" style="color:#f44336">Error:</span> ${error.message}`);
                updateStatus(`Error: ${error.message}`, true);
                document.querySelector('button').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }
        
        function handleAdvertisement(event) {
            advertisementCount++;
            
            // Update status
            updateStatus(`Receiving... (${advertisementCount} packets, RSSI: ${event.rssi}dBm)`);
            
            let html = `<div>`;
            html += `<span class="time">[${new Date().toLocaleTimeString()}]</span> `;
            html += `<span class="counter">Packet #${advertisementCount}</span>: `;
            html += `<span class="rssi">RSSI: ${event.rssi}dBm</span>`;
            
            // Check for manufacturer data
            if (event.manufacturerData && event.manufacturerData.size > 0) {
                event.manufacturerData.forEach((data, manufacturerId) => {
                    html += `<br><span class="time">Manufacturer ID:</span> <span class="hex">0x${manufacturerId.toString(16).toUpperCase()}</span>`;
                    
                    // Convert to hex string
                    let hexStr = '';
                    let asciiStr = '';
                    let bytes = [];
                    
                    for (let i = 0; i < data.byteLength; i++) {
                        const byte = data.getUint8(i);
                        bytes.push(byte);
                        hexStr += ('0' + byte.toString(16)).slice(-2) + ' ';
                        asciiStr += (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : '.';
                    }
                    
                    html += `<br><span class="time">Hex:</span> <span class="hex">${hexStr}</span>`;
                    html += `<br><span class="time">ASCII:</span> <span class="text">${asciiStr}</span>`;
                    
                    // Try to decode our format (20 bytes expected)
                    if (data.byteLength >= 20) {
                        try {
                            const view = new DataView(data.buffer);
                            
                            // Manufacturer ID (bytes 0-1, little-endian)
                            const manuId = (bytes[1] << 8) | bytes[0];
                            
                            // Device type and version
                            const deviceType = bytes[2];
                            const version = bytes[3];
                            
                            // Counter (bytes 4-7, little-endian)
                            const counter = view.getUint32(4, true);
                            
                            // Temperature (bytes 8-9, little-endian, in 0.1°C)
                            const tempRaw = view.getInt16(8, true);
                            const temperature = tempRaw / 10.0;
                            
                            // Humidity (byte 10)
                            const humidity = bytes[10];
                            
                            // Status (byte 11)
                            const status = bytes[11];
                            
                            // Text (bytes 12-19)
                            let text = '';
                            for (let i = 12; i < 20; i++) {
                                if (bytes[i] >= 32 && bytes[i] <= 126) {
                                    text += String.fromCharCode(bytes[i]);
                                }
                            }
                            
                            html += `<br><span class="time">Decoded:</span>`;
                            html += ` <span class="counter">Counter: ${counter}</span>`;
                            html += ` <span class="temp">Temp: ${temperature.toFixed(1)}°C</span>`;
                            html += ` <span class="humidity">Humidity: ${humidity}%</span>`;
                            html += ` <span class="text">Text: "${text}"</span>`;
                            
                        } catch (e) {
                            html += `<br><span class="time">Decode error:</span> ${e.message}`;
                        }
                    }
                });
            } else {
                html += `<br><span class="time" style="color:#ff9800">No manufacturer data found</span>`;
            }
            
            html += `</div>`;
            log(html);
        }
        
        function stopScan() {
            if (device) {
                device.unwatchAdvertisements();
                device.removeEventListener('advertisementreceived', handleAdvertisement);
                log('<span class="time">Stopped receiving data.</span>');
            }
            
            document.querySelector('button').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            updateStatus('Ready to scan again.');
        }
    </script>
</body>
</html>
