<!DOCTYPE html>
<html>
<head>
    <title>ESP32 BLE Receiver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        button {
            padding: 15px 30px;
            margin: 10px 5px;
            font-size: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background: #1976D2;
        }
        #log {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
            background: #f9f9f9;
        }
        .entry {
            margin: 5px 0;
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .time {
            color: #999;
            font-size: 11px;
        }
        .hex {
            color: #2196F3;
            font-weight: bold;
        }
        .error {
            color: #f44336;
            background: #ffebee;
        }
        .success {
            color: #4CAF50;
            background: #e8f5e9;
        }
        #status {
            margin: 15px 0;
            padding: 12px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>ESP32 BLE Receiver</h1>
    <p>Connects to ESP32 and reads GATT characteristic data in real-time.</p>
    
    <button onclick="connect()">Connect to ESP32</button>
    <button onclick="disconnect()" id="disconnectBtn" disabled>Disconnect</button>
    
    <div id="status">Ready. Click "Connect to ESP32"</div>
    
    <h3>Received Data:</h3>
    <div id="log">No data received yet...</div>
    
    <script>
        const SERVICE_UUID = "12345678-1234-5678-1234-567890abcdef";
        const CHARACTERISTIC_UUID = "87654321-4321-8765-4321-fedcba987654";
        
        let device = null;
        let characteristic = null;
        let dataCount = 0;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'entry ' + type;
            
            const time = new Date().toLocaleTimeString();
            let icon = '📡';
            if (type === 'error') icon = '❌';
            else if (type === 'success') icon = '✅';
            
            entry.innerHTML = `<span class="time">[${time}]</span> ${icon} ${message}`;
            logDiv.prepend(entry);
            
            // Keep only last 100 entries
            while (logDiv.children.length > 100) {
                logDiv.removeChild(logDiv.lastChild);
            }
        }
        
        function updateStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.style.background = isError ? '#ffebee' : '#e3f2fd';
            statusDiv.style.color = isError ? '#c62828' : '#1565c0';
        }
        
        async function connect() {
            try {
                updateStatus('Scanning for ESP32...');
                log('Requesting device...');
                
                // Request device
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-Beacon' }],
                    optionalServices: [SERVICE_UUID]
                });
                
                log(`Found: ${device.name}`, 'success');
                updateStatus('Connecting...');
                
                // Connect to GATT server
                const server = await device.gatt.connect();
                log('GATT server connected', 'success');
                
                // Get service
                const service = await server.getPrimaryService(SERVICE_UUID);
                log(`Service found: ${SERVICE_UUID}`, 'success');
                
                // Get characteristic
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                log(`Characteristic found: ${CHARACTERISTIC_UUID}`, 'success');
                
                // Read initial value
                const initialValue = await characteristic.readValue();
                displayData(initialValue);
                
                // Setup notifications
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    displayData(event.target.value);
                });
                
                log('Notifications enabled - waiting for data...', 'success');
                updateStatus(`Connected to ${device.name}. Receiving data...`);
                
                document.querySelector('button').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                
            } catch (error) {
                console.error('Error:', error);
                if (error.name === 'NotFoundError') {
                    log('ESP32-Beacon not found. Make sure ESP32 is powered on and advertising.', 'error');
                } else if (error.name === 'SecurityError') {
                    log('Permission denied. Please allow Bluetooth access.', 'error');
                } else {
                    log(`Error: ${error.message}`, 'error');
                }
                updateStatus(`Connection failed: ${error.message}`, true);
            }
        }
        
        function displayData(value) {
            dataCount++;
            
            // Convert DataView to hex string
            let hexStr = '';
            let asciiStr = '';
            
            for (let i = 0; i < value.byteLength; i++) {
                const byte = value.getUint8(i);
                hexStr += byte.toString(16).padStart(2, '0').toUpperCase() + ' ';
                
                // ASCII representation
                if (byte >= 32 && byte <= 126) {
                    asciiStr += String.fromCharCode(byte);
                } else {
                    asciiStr += '.';
                }
            }
            
            // Parse as test data
            let parsed = '';
            if (value.byteLength >= 6) {
                const byte0 = value.getUint8(0);
                const byte1 = value.getUint8(1);
                const counter = (byte0 << 8) | byte1;
                parsed = ` | Counter: ${counter}`;
            }
            
            const msg = `<span class="hex">Packet #${dataCount}</span> | Hex: ${hexStr} | ASCII: ${asciiStr}${parsed}`;
            log(msg, 'info');
            updateStatus(`Receiving data... (${dataCount} packets received)`);
        }
        
        function disconnect() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
                log('Disconnected from ESP32', 'info');
                updateStatus('Disconnected. Ready to connect again.');
                
                document.querySelector('button').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                dataCount = 0;
            }
        }
    </script>
</body>
</html>
