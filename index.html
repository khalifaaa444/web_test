<!DOCTYPE html>
<html>
<head>
    <title>ESP32 BLE Beacon Monitor</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 12px 24px; margin: 5px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #output { border: 1px solid #ccc; padding: 15px; margin-top: 20px; white-space: pre-wrap; font-family: monospace; }
        .device { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .device:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>ESP32 BLE Beacon Monitor</h1>
    <p><strong>Note:</strong> This works in Chrome/Edge on desktop and Android.</p>
    
    <div>
        <button onclick="startScan()" id="scanBtn">Start Scan</button>
        <button onclick="stopScan()" id="stopBtn" disabled>Stop Scan</button>
    </div>
    
    <div id="deviceList" style="margin: 20px 0;">
        <p>No devices found. Click "Start Scan".</p>
    </div>
    
    <div id="output">Ready...</div>
    
    <script>
        let selectedDevice = null;
        
        async function startScan() {
            try {
                document.getElementById('scanBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('output').textContent = 'Scanning...\n';
                
                // Request device with specific filters for ESP32
                selectedDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        {namePrefix: 'ESP32'},
                        {namePrefix: 'ESP'}
                    ],
                    optionalServices: []
                });
                
                document.getElementById('output').textContent += 
                    `Selected: ${selectedDevice.name || 'Unknown'}\n` +
                    `ID: ${selectedDevice.id}\n\n`;
                
                // Listen for advertisements
                selectedDevice.addEventListener('advertisementreceived', event => {
                    displayAdvertisement(event);
                });
                
                // Start watching advertisements
                await selectedDevice.watchAdvertisements();
                
                document.getElementById('output').textContent += 
                    'Now watching for advertisements...\n' +
                    'Keep this tab open to receive data.\n';
                
                // Show device info
                document.getElementById('deviceList').innerHTML = `
                    <div class="device" style="background: #e8f5e8;">
                        <strong>Connected to:</strong> ${selectedDevice.name || 'Unknown'}<br>
                        <small>ID: ${selectedDevice.id}</small>
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('output').textContent = 'Error: ' + error;
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }
        
        function displayAdvertisement(event) {
            const output = document.getElementById('output');
            let text = `\n=== New Advertisement ===\n`;
            text += `Time: ${new Date().toLocaleTimeString()}\n`;
            text += `Device: ${event.device.name || 'Unknown'}\n`;
            text += `RSSI: ${event.rssi} dBm\n`;
            
            if (event.manufacturerData && event.manufacturerData.size > 0) {
                text += `\nManufacturer Data:\n`;
                event.manufacturerData.forEach((value, key) => {
                    text += `  ID: 0x${key.toString(16).toUpperCase()}\n`;
                    
                    // Convert to hex string
                    let hexStr = '';
                    for (let i = 0; i < value.byteLength; i++) {
                        hexStr += ('0' + value.getUint8(i).toString(16)).slice(-2) + ' ';
                    }
                    text += `  Hex: ${hexStr}\n`;
                    
                    // Try to decode as our custom struct
                    if (value.byteLength >= 12) {
                        try {
                            const view = new DataView(value.buffer);
                            const temp = view.getInt16(8, true) / 10.0;
                            const humidity = view.getUint8(10);
                            const counter = view.getUint32(4, true);
                            text += `  Decoded: Temp=${temp}°C, Humidity=${humidity}%, Counter=${counter}\n`;
                        } catch (e) {
                            // Not our format, continue
                        }
                    }
                });
            }
            
            // Keep only last 10 advertisements
            const lines = output.textContent.split('\n');
            const newLines = text.split('\n');
            const allLines = lines.concat(newLines);
            if (allLines.length > 50) {
                allLines.splice(0, allLines.length - 50);
            }
            output.textContent = allLines.join('\n');
        }
        
        function stopScan() {
            if (selectedDevice) {
                selectedDevice.unwatchAdvertisements();
                document.getElementById('output').textContent += '\nScan stopped.\n';
            }
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    </script>
</body>
</html>
