<!DOCTYPE html>
<html>
<head>
    <title>ESP32 BLE Monitor - No Pairing</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        button { 
            padding: 12px 24px; 
            margin: 5px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
        }
        #output { 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin-top: 20px; 
            white-space: pre-wrap; 
            font-family: monospace;
            background: #f9f9f9;
            min-height: 300px;
            overflow-y: auto;
        }
        .data-line { 
            margin: 5px 0; 
            padding: 5px; 
            border-bottom: 1px solid #eee; 
        }
        .timestamp { 
            color: #666; 
            font-size: 0.9em; 
        }
        .rssi { 
            color: #0066cc; 
            font-weight: bold; 
        }
        .hex-data { 
            color: #009900; 
            font-family: monospace; 
        }
    </style>
</head>
<body>
    <h1>ESP32 BLE Beacon Monitor</h1>
    <p><strong>Note:</strong> This reads ESP32 advertisements WITHOUT pairing.</p>
    <p>Device name should be: <strong>ESP32-Beacon</strong></p>
    
    <div>
        <button onclick="startScan()" id="scanBtn">Start Scan</button>
        <button onclick="stopScan()" id="stopBtn" disabled>Stop Scan</button>
        <button onclick="clearOutput()" id="clearBtn">Clear</button>
    </div>
    
    <div id="status" style="margin: 10px 0; padding: 10px; background: #e8f5e9; border-radius: 5px;">
        Ready to scan...
    </div>
    
    <div id="output">Data will appear here...</div>
    
    <script>
        let selectedDevice = null;
        let isScanning = false;
        let advertisementCount = 0;
        
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.style.background = type === 'error' ? '#ffebee' : 
                                        type === 'scanning' ? '#e3f2fd' : '#e8f5e9';
        }
        
        function addToOutput(message) {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'data-line';
            line.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            
            // Add to top (newest first)
            if (output.firstChild) {
                output.insertBefore(line, output.firstChild);
            } else {
                output.appendChild(line);
            }
            
            // Keep only last 50 lines
            while (output.children.length > 50) {
                output.removeChild(output.lastChild);
            }
        }
        
        function clearOutput() {
            document.getElementById('output').innerHTML = '';
            advertisementCount = 0;
        }
        
        async function startScan() {
            try {
                updateStatus('Scanning... Please select ESP32-Beacon from the list', 'scanning');
                document.getElementById('scanBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('clearBtn').disabled = false;
                
                addToOutput('Starting BLE scan...');
                
                // Request BLE device WITHOUT requesting any services
                // This prevents pairing
                selectedDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        { name: 'ESP32-Beacon' },  // Exact name match
                        { namePrefix: 'ESP32' }     // Or any ESP32 device
                    ],
                    // Do NOT request any services - this prevents pairing
                    optionalServices: []  // Empty array = no services requested
                });
                
                addToOutput(`Connected to: <strong>${selectedDevice.name || 'Unknown'}</strong>`);
                addToOutput(`Device ID: ${selectedDevice.id}`);
                
                // Add event listener for advertisements
                selectedDevice.addEventListener('advertisementreceived', handleAdvertisement);
                
                // IMPORTANT: Use watchAdvertisements() not watchAdvertisement()
                await selectedDevice.watchAdvertisements();
                
                updateStatus('Success! Now receiving advertisements from ESP32', 'info');
                addToOutput('Now listening for advertisements...');
                isScanning = true;
                
            } catch (error) {
                // User cancelled or error occurred
                if (error.name === 'NotFoundError') {
                    updateStatus('No ESP32 device found. Make sure it\'s advertising.', 'error');
                    addToOutput('Error: No ESP32 device found');
                } else if (error.name === 'SecurityError') {
                    updateStatus('Permission denied. Please allow Bluetooth access.', 'error');
                    addToOutput('Error: Bluetooth permission denied');
                } else if (error.name === 'NotSupportedError') {
                    updateStatus('Web Bluetooth not supported in this browser.', 'error');
                    addToOutput('Error: Web Bluetooth not supported');
                } else {
                    updateStatus(`Error: ${error.message || error}`, 'error');
                    addToOutput(`Error: ${error.message || error}`);
                }
                
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                isScanning = false;
            }
        }
        
        function handleAdvertisement(event) {
            advertisementCount++;
            
            // Update status with count
            updateStatus(`Receiving data... (${advertisementCount} ads received)`, 'scanning');
            
            let message = `Advertisement #${advertisementCount}: `;
            message += `RSSI: <span class="rssi">${event.rssi}dBm</span>`;
            
            if (event.manufacturerData && event.manufacturerData.size > 0) {
                message += '<br>Manufacturer Data: ';
                
                event.manufacturerData.forEach((dataArray, manufacturerId) => {
                    // Convert to hex string
                    let hexStr = '';
                    let asciiStr = '';
                    
                    for (let i = 0; i < dataArray.byteLength; i++) {
                        const byte = dataArray.getUint8(i);
                        hexStr += ('0' + byte.toString(16)).slice(-2) + ' ';
                        
                        // Also show ASCII if printable
                        if (byte >= 32 && byte <= 126) {
                            asciiStr += String.fromCharCode(byte);
                        } else {
                            asciiStr += '.';
                        }
                    }
                    
                    message += `<br>  ID: 0x${manufacturerId.toString(16).toUpperCase()}`;
                    message += `<br>  Hex: <span class="hex-data">${hexStr}</span>`;
                    message += `<br>  ASCII: ${asciiStr}`;
                    
                    // Try to decode our specific format
                    if (dataArray.byteLength >= 12) {
                        try {
                            const view = new DataView(dataArray.buffer);
                            const manufacturerId = view.getUint16(0, true);
                            const deviceType = view.getUint8(2);
                            const version = view.getUint8(3);
                            const counter = view.getUint32(4, true);
                            const temperature = view.getInt16(8, true) / 10.0;
                            const humidity = view.getUint8(10);
                            const status = view.getUint8(11);
                            
                            message += `<br>  Decoded: Counter=${counter}, Temp=${temperature.toFixed(1)}°C, Humidity=${humidity}%`;
                        } catch (e) {
                            // Not our format, skip
                        }
                    }
                });
            }
            
            addToOutput(message);
        }
        
        function stopScan() {
            if (selectedDevice) {
                // Stop watching advertisements
                selectedDevice.unwatchAdvertisements();
                selectedDevice.removeEventListener('advertisementreceived', handleAdvertisement);
                
                addToOutput('Scan stopped.');
                updateStatus('Scan stopped', 'info');
            }
            
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            isScanning = false;
        }
        
        // Auto-start on page load (optional)
        // window.addEventListener('load', function() {
        //     setTimeout(startScan, 1000);
        // });
    </script>
</body>
</html>
