<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32 BLE Receiver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        #log {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
            background: #f0f0f0;
            font-family: monospace;
            font-size: 12px;
        }
        .packet {
            margin: 2px 0;
            padding: 2px;
            border-left: 3px solid #007BFF;
        }
        .rssi-good { color: green; }
        .rssi-medium { color: orange; }
        .rssi-poor { color: red; }
    </style>
</head>
<body>
    <h2>ESP32 BLE Broadcast Receiver</h2>
    
    <button onclick="startScan()">Start Scan</button>
    <button onclick="stopScan()" id="stopBtn" disabled>Stop</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <div id="status">Ready. Click Start Scan.</div>
    
    <div style="margin: 10px 0;">
        <strong>Packets:</strong> <span id="packetCount">0</span> | 
        <strong>RSSI:</strong> <span id="lastRssi">--</span> dBm
    </div>
    
    <div id="log">No data received yet.</div>
    
    <script>
        let device = null;
        let packetCount = 0;
        let isScanning = false;
        
        function addToLog(message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'packet';
            entry.textContent = message;
            logDiv.prepend(entry);
            
            if (logDiv.children.length > 100) {
                logDiv.removeChild(logDiv.lastChild);
            }
        }
        
        function updateStatus(msg) {
            document.getElementById('status').textContent = msg;
        }
        
        function updateStats(rssi) {
            document.getElementById('packetCount').textContent = packetCount;
            document.getElementById('lastRssi').textContent = rssi;
        }
        
        async function startScan() {
            if (isScanning) return;
            
            try {
                updateStatus('Requesting BLE access...');
                
                if (!navigator.bluetooth) {
                    throw new Error('Web Bluetooth not supported');
                }
                
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-Beacon' }],
                    optionalServices: []
                });
                
                updateStatus('Found ESP32. Receiving data...');
                
                device.addEventListener('advertisementreceived', (event) => {
                    packetCount++;
                    const time = new Date().toLocaleTimeString();
                    const rssi = event.rssi;
                    
                    let logMsg = `[${time}] Packet #${packetCount}: RSSI: ${rssi}dBm`;
                    
                    if (event.manufacturerData && event.manufacturerData.size > 0) {
                        event.manufacturerData.forEach((data, manufacturerId) => {
                            let hexStr = '';
                            for (let i = 0; i < data.byteLength; i++) {
                                hexStr += data.getUint8(i).toString(16).padStart(2, '0').toUpperCase() + ' ';
                            }
                            logMsg += ` | Data: ${hexStr}`;
                        });
                    } else {
                        logMsg += ' | No manufacturer data';
                    }
                    
                    addToLog(logMsg);
                    updateStats(rssi);
                    updateStatus(`Receiving... (${packetCount} packets, RSSI: ${rssi}dBm)`);
                });
                
                await device.watchAdvertisements();
                isScanning = true;
                document.getElementById('stopBtn').disabled = false;
                
            } catch (error) {
                addToLog(`ERROR: ${error.message}`);
                updateStatus('Scan failed');
                stopScan();
            }
        }
        
        function stopScan() {
            if (device && isScanning) {
                if (device.unwatchAdvertisements) {
                    device.unwatchAdvertisements();
                }
                isScanning = false;
                updateStatus('Scan stopped');
                document.getElementById('stopBtn').disabled = true;
            }
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = 'No data received yet.';
            packetCount = 0;
            updateStats('--');
        }
    </script>
</body>
</html>
