<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32 BLE Broadcast Receiver</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        h2 { color: #333; }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:disabled {
            background: #aaa;
        }
        #log {
            margin-top: 20px;
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
        }
        .entry {
            padding: 6px;
            border-bottom: 1px solid #eee;
        }
        .strong { color: green; }
        .medium { color: orange; }
        .weak { color: red; }
    </style>
</head>

<body>

<h2>ESP32 BLE Broadcast Receiver</h2>

<button onclick="startScan()">Start Scan</button>
<button onclick="stopScan()" id="stopBtn" disabled>Stop</button>

<div id="log">Waiting...</div>

<script>
let scan = null;
let packetCount = 0;

function log(msg, cls = "") {
    const div = document.createElement("div");
    div.className = "entry " + cls;
    div.innerHTML = msg;
    document.getElementById("log").prepend(div);
}

function rssiClass(rssi) {
    if (rssi > -55) return "strong";
    if (rssi > -75) return "medium";
    return "weak";
}

async function startScan() {
    if (!navigator.bluetooth) {
        alert("Web Bluetooth not supported");
        return;
    }

    document.getElementById("stopBtn").disabled = false;

    try {
        scan = await navigator.bluetooth.requestLEScan({
            filters: [{ name: "ESP32-Beacon" }],
            keepRepeatedDevices: true
        });

        log("📡 Scanning started...");

        navigator.bluetooth.addEventListener("advertisementreceived", event => {
            packetCount++;

            let rssi = event.rssi;
            let txt = `<b>#${packetCount}</b> RSSI: <span class="${rssiClass(rssi)}">${rssi} dBm</span>`;

            if (event.manufacturerData.size > 0) {
                for (const [id, data] of event.manufacturerData.entries()) {
                    let hex = "";
                    let ascii = "";

                    for (let i = 0; i < data.byteLength; i++) {
                        const b = data.getUint8(i);
                        hex += b.toString(16).padStart(2, "0").toUpperCase() + " ";
                        ascii += (b >= 32 && b <= 126) ? String.fromCharCode(b) : ".";
                    }

                    txt += `<br>Manufacturer ID: 0x${id.toString(16).toUpperCase()}`;
                    txt += `<br>HEX: ${hex}`;
                    txt += `<br>ASCII: ${ascii}`;
                }
            }

            log(txt);
        });

    } catch (err) {
        alert("Error: " + err.message);
        console.error(err);
    }
}

function stopScan() {
    if (scan) {
        scan.stop();
        log("🛑 Scan stopped");
        document.getElementById("stopBtn").disabled = true;
    }
}
</script>

</body>
</html>
